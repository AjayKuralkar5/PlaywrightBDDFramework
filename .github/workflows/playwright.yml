name: Playwright BDD Automation

on:
  workflow_dispatch:
    inputs:

      cucumber_tag:
        description: "Select test suite"
        required: true
        default: "@TextBox"
        type: choice
        options:
          - "@TextBox"
          - "@Mobile"
          - "@API"
          - "@Smoke"
          - "@UI"
          - "@Regression"

      browser:
        description: "Select browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - "chromium"
          - "firefox"
          - "webkit"

      device:
        description: "Select device"
        required: true
        default: "desktop"
        type: choice
        options:
          - "desktop"
          - "pixel5"
          - "iphone13"
          - "galaxyA55"

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Selected Browser
        if: inputs.cucumber_tag != '@API'
        run: npx playwright install --with-deps "${{ inputs.browser }}"

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Run Selected Cucumber Tests
        env:
          BROWSER: ${{ inputs.browser }}
          DEVICE: ${{ inputs.device }}
          REPORT_NAME: ${{ inputs.cucumber_tag == '@API' && 'api' || inputs.browser }}
        run: npx cucumber-js --tags "${{ inputs.cucumber_tag }}"

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ inputs.browser }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30